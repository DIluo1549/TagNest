services:
  tagnest:
    build: .
    container_name: tagnest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: TZ:-Asia/Shanghai
      PUID: PUID:-1000
      PGID: PGID:-1000
      # 强烈建议设置密码；留空表示局域网内无需登录。
      TAGNEST_PASSWORD:
      TAGNEST_DATA_DIR: /data
      TAGNEST_MUSIC_DIRS: /music
    volumes:
      # 配置、索引、封面缓存和歌词之外的辅助数据。
      - ./data:/data
      # 改成 NAS 上的真实音乐目录；容器内路径固定为 /music。
      # 这个目录需要可写，标签和歌词会写回文件。
      - /volume1/music:/music
